<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Calcolatore</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Calcolatore"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#000000"><meta name="robots" content="noindex, nofollow">
<style>
  :root{--fondo:#f5f5f7;--carta:#fff;--testo:#111;--testo-2:#555;--filo:#d2d2d7;--nero:#000;--bianco:#fff;--rosso:#b3261e}
  @media (prefers-color-scheme: dark){:root{--fondo:#000;--carta:#1c1c1e;--testo:#f5f5f7;--testo-2:#a1a1a6;--filo:#3a3a3c;--nero:#fff;--bianco:#000;--rosso:#ff8a80}}
  html,body{margin:0;background:var(--fondo);color:var(--testo);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
  .porta{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
  .scheda{width:100%;max-width:420px;background:var(--carta);border:1px solid var(--filo);border-radius:20px;padding:28px 24px;box-sizing:border-box}
  .marchio{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .marchio img{width:44px;height:44px;border-radius:10px}
  .marchio b{display:block;font-size:17px}
  .marchio small{color:var(--testo-2);font-size:14px}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:0 0 18px;color:var(--testo-2);font-size:15px}
  label{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
  input[type=password]{width:100%;box-sizing:border-box;min-height:52px;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--filo);background:var(--fondo);color:var(--testo)}
  button{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:999px;background:var(--nero);color:var(--bianco);font:600 17px/1.2 inherit;cursor:pointer}
  button:disabled{opacity:.5}
  .stato{min-height:22px;margin-top:12px;font-size:15px;color:var(--testo-2)}
  .stato.errore{color:var(--rosso);font-weight:600}
  .nascosto{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .apre{display:none;text-align:center;color:var(--testo-2)}
  body.apre-subito .scheda form{display:none}
  body.apre-subito .apre{display:block}
</style>
</head>
<body>
<main class="porta">
  <div class="scheda">
    <div class="marchio"><img src="icon-192.png" alt=""><div><b>Calcolatore del guadagno</b><small>Sistema Agenda Piena</small></div></div>
    <div class="apre" id="apre">Apro il calcolatore…</div>
    <form id="porta" autocomplete="on">
      <h1>Parola d'ordine</h1>
      <p>Scrivila una volta: poi questo iPad la ricorda e il calcolatore si apre da solo, anche senza rete.</p>
      <input class="nascosto" type="text" name="username" autocomplete="username" value="calcolatore" tabindex="-1" aria-hidden="true">
      <label for="parola">La parola d'ordine</label>
      <input id="parola" name="password" type="password" autocomplete="current-password" required>
      <button id="entra" type="submit">Apri il calcolatore</button>
      <div class="stato" id="stato" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>
<script>
(function(){
  'use strict';
  var AVVOLTA = {"sale": "A43uNUKDFeBZ+Dg1TpZ0xg==", "giri": 600000, "iv": "isTmftBRb516uB+9", "avvolta": "ZEHWLgpIAyQS4dbeMd0mRXipepMm4+o5YjpalZjp2l3QOXK0xQd3fKmDTvS4V2Ee"};      // la chiave del contenuto, chiusa con la parola d'ordine di Steven
  var VERSIONE = 'c98a0a440bb3';
  var TESTA_APP = "<link rel=\"manifest\" href=\"manifest.webmanifest\"><link rel=\"apple-touch-icon\" href=\"apple-touch-icon.png\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-title\" content=\"Calcolatore\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\"><meta name=\"theme-color\" content=\"#000000\"><meta name=\"robots\" content=\"noindex, nofollow\">";      // icona, nome e manifest: restano anche nella pagina aperta
  var CHIAVE_SALVATA = 'calcolatore-chiave';
  var el = function(id){ return document.getElementById(id); };
  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function a64(u){ var s = ''; for(var i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
  function stato(t, errore){ var s = el('stato'); s.textContent = t; s.className = 'stato' + (errore ? ' errore' : ''); }
  function leggi(){ try { return localStorage.getItem(CHIAVE_SALVATA); } catch(x){ return null; } }
  function ricorda(k){ try { localStorage.setItem(CHIAVE_SALVATA, k); } catch(x){} }
  function dimentica(){ try { localStorage.removeItem(CHIAVE_SALVATA); } catch(x){} }

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

  async function contenuto(){
    var r = await fetch('contenuto.bin?v=' + VERSIONE);
    if(!r.ok) throw new Error('scaricamento: ' + r.status);
    return new Uint8Array(await r.arrayBuffer());
  }
  async function apri(chiaveGrezza){
    if(typeof DecompressionStream === 'undefined') throw new Error('vecchio');
    var k = await crypto.subtle.importKey('raw', chiaveGrezza, 'AES-GCM', false, ['decrypt']);
    var dati = await contenuto();
    var chiaro = await crypto.subtle.decrypt({name: 'AES-GCM', iv: dati.subarray(0, 12)}, k, dati.subarray(12));
    var flusso = new Blob([chiaro]).stream().pipeThrough(new DecompressionStream('gzip'));
    var html = await new Response(flusso).text();
    html = html.replace(/<head>/i, '<head>\n' + TESTA_APP);
    document.open(); document.write(html); document.close();
  }
  async function sblocca(parola){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(parola.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    var kp = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(AVVOLTA.sale), iterations: AVVOLTA.giri, hash: 'SHA-256'},
                                          base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(AVVOLTA.iv)}, kp, b64(AVVOLTA.avvolta)));
  }
  function guasto(x){
    if(x && x.message === 'vecchio') return 'Questo iPad è troppo vecchio per il calcolatore: serve iPadOS 16.4 o più nuovo (Impostazioni › Generali › Aggiornamento software).';
    if(x && /scaricamento|Failed to fetch|Load failed|NetworkError/i.test(String(x.message))) return 'Non riesco a scaricare il calcolatore: controlla la rete e riprova. Dopo la prima apertura funziona anche senza rete.';
    return 'Il calcolatore non si apre (' + (x && x.message || x) + '). Riprova; se si ripete, dillo a Claude.';
  }

  var salvata = leggi();
  if(salvata){
    document.body.classList.add('apre-subito');
    apri(b64(salvata)).catch(function(x){
      document.body.classList.remove('apre-subito');
      if(x && x.name === 'OperationError'){ dimentica(); stato('Il calcolatore è cambiato: scrivi di nuovo la parola d’ordine.'); }
      else stato(guasto(x), true);
    });
  }
  el('porta').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var p = el('parola').value;
    if(!p) return;
    el('entra').disabled = true; stato('Controllo la parola d’ordine…');
    var k;
    try { k = await sblocca(p); }
    catch(x){ el('entra').disabled = false; stato('Parola d’ordine sbagliata. Riprova.', true); el('parola').select(); return; }
    ricorda(a64(k));
    stato('Apro il calcolatore…');
    try { await apri(k); }
    catch(x){ el('entra').disabled = false; stato(guasto(x), true); }
  });
})();
</script>
</body>
</html>
